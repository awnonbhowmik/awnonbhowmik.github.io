name: Sync Citation Counts

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (avoid peak Scholar traffic)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated publications.ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-citations.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-citations.txt

      - name: Run citation sync
        run: python scripts/sync-citations.py

      - name: Commit if citations changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/data/publications.ts
          git diff --staged --quiet \
            || git commit -m "chore: sync citation counts [skip ci]"
          git push
