name: Deploy Next.js Site to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Update to the version you're using

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Check if 'out/' Exists
        run: ls -l out/ || echo "Directory 'out/' not found!"

      - name: Move Build Output (Only If Exists)
        run: |
          if [ -d "out" ]; then
            mv out/* . && rm -rf out
          else
            echo "No 'out/' directory found. Skipping move."
          fi

      - name: Commit and Push Changes
        run: |
          # Only commit and push if there are changes
          if [[ $(git status --porcelain) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Automated deployment from GitHub Actions"
            git push origin main
          else
            echo "No changes to commit. Skipping push."
          fi
